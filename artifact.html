*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
body{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.me{width:48px;height:48px;border-radius:50%;border:3px solid var(--coral);background:var(--card);padding:0;display:grid;place-items:center}
.cal{line-height:1.15;min-width:0;white-space:nowrap}.cal b{font-family:var(--display);font-weight:800;font-size:1.15rem;display:block}.cal small{color:var(--muted);font-size:.8rem}
.stats{display:flex;gap:6px;align-items:center}
.money{font-family:var(--display);font-size:1.05rem;color:var(--lagoon-d);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .money{color:#7FE3DC}}
.rep{display:flex;align-items:center;gap:2px;font-family:var(--display);color:var(--sun-d);white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rep{color:var(--sun)}}
select{font:inherit;font-size:.8rem;font-weight:600;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:3px 2px}

/* bottom bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:2px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-radius:20px 20px 0 0;box-shadow:0 -6px 18px rgba(11,58,83,.08)}
.tab{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;color:var(--muted);font-size:.74rem;font-weight:600}
.tab .ic{width:40px;height:28px;padding:3px 9px;border-radius:14px;transition:background .2s}
.tab.on{color:var(--coral)}.tab.on .ic{background:var(--coral);color:#fff}
.tab .dot{position:absolute;top:3px;right:calc(50% - 22px);width:10px;height:10px;border-radius:50%;background:var(--sun);border:2px solid var(--card)}

/* buttons */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:13px 12px;font-weight:600;margin:10px 0;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn small{display:block;font-weight:400;font-size:.8rem;opacity:.9}.btn.sm{padding:9px;font-size:.95rem}
.btn.primary{background:var(--lagoon);color:#fff;box-shadow:0 4px 0 var(--lagoon-d)}
.btn.sun{background:var(--sun);color:#3A2600;box-shadow:0 4px 0 var(--sun-d)}
.btn.fly{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--coral);color:#fff;font-family:var(--display);font-size:1.35rem;font-weight:800;min-height:60px;position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));box-shadow:0 5px 0 var(--coral-d),0 10px 24px rgba(239,79,58,.3);margin-top:16px;z-index:4}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}.btn.fly:disabled{opacity:1;background:#F2A090}
.btn.inl{display:inline-block;width:auto;margin:0 0 0 6px;padding:6px 12px}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px 0;font-size:.9rem}
.x{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:1.5rem;line-height:1;flex:none}
.x.sm{position:absolute;top:10px;right:10px;width:36px;height:36px;font-size:1.2rem}

.card{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0}
.card h3{margin:0;font-size:1.3rem}.card p{margin:6px 0}
.muted{color:var(--muted)}.small{font-size:.88rem}.center{text-align:center}
.sect{font-size:1.5rem;margin:18px 0 0}
.pos{color:var(--good)}.neg{color:var(--bad)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.bar div{height:100%;background:var(--lagoon);border-radius:5px}
.empty{text-align:center;padding:22px 16px}.empty svg{display:block;margin:0 auto 6px}

/* map */
.mapbox{border-radius:22px;overflow:hidden;border:4px solid var(--card);box-shadow:0 6px 0 rgba(11,58,83,.12);margin-top:4px}
.map{display:block;width:100%;height:auto;touch-action:manipulation}
.mlbl{font-family:var(--display);font-weight:800;font-size:18px;fill:#0B3A53;stroke:#FFFFFF;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
.mlbl.closed{fill:#4F6E7E}.mlbl.small{font-size:11px;stroke-width:3px;fill:#0B3A53;opacity:.75}
.mlbl.ocean{font-size:20px;fill:#FFFFFF;stroke:none;opacity:.55;letter-spacing:.2em;text-anchor:middle}
.apt{cursor:pointer}.apt:focus{outline:none}.apt:focus-visible circle:nth-child(2){stroke:#FFB627;stroke-width:3}
.flow{animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}
.cloud{animation:drift 40s ease-in-out infinite alternate}.cloud.c1{animation-duration:55s}.cloud.c2{animation-duration:47s}
@keyframes drift{from{translate:-14px 0}to{translate:14px 0}}
.swirl{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(-360deg)}}
.pulse{animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{from{transform:scale(.7);opacity:1}to{transform:scale(1.5);opacity:0}}
.pop{opacity:0;animation:pop 1.6s ease-out forwards}@keyframes pop{0%{opacity:0;translate:0 6px}20%{opacity:1;translate:0 0}80%{opacity:1}100%{opacity:0;translate:0 -10px}}
.hop{animation:hop .6s ease-in-out infinite alternate}@keyframes hop{to{translate:0 -4px}}
.whale path:first-child{animation:hop 1.8s ease-in-out infinite alternate}

/* the manu talks */
.bubble{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:0;margin:14px 0 6px}
.bubble svg{flex:none}
.bubble span{position:relative;flex:1;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:11px 14px;font-size:.98rem}
.bubble span::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.goal{background:var(--goal);border:2px dashed var(--sun);border-radius:16px;padding:10px 14px;margin:10px 0}
.goal b{font-family:var(--display);font-weight:800;font-size:1.1rem;display:block;margin:2px 0 6px}.goal .bar{background:rgba(201,138,0,.2)}.goal .bar div{background:var(--sun)}
.gtop{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem}.bonus{font-weight:600;color:var(--sun-d)}
.goal.done b{margin:0}

/* destination card */
.dest h3{font-size:1.7rem;padding-right:40px}.dest .muted{margin-top:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.facts small{display:block;color:var(--muted);font-size:.74rem}.facts b{font-family:var(--display);font-weight:800;font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font-size:.78rem;font-weight:600;border-radius:999px;padding:3px 9px;border:2px solid var(--line)}.chip.yes{background:#D6F4EF;color:#0B5E5A;border-color:#9BDCD3}.chip.no{color:var(--muted);text-decoration:line-through;opacity:.8}

/* boarding pass */
.pass{background:var(--card);border-radius:20px;margin:14px 0;overflow:hidden;box-shadow:0 0 0 2px var(--line),0 6px 0 rgba(11,58,83,.08)}
.pass header{display:flex;align-items:center;gap:8px;background:var(--c);color:#fff;padding:8px 14px}
.pass header b{font-family:var(--display);font-weight:800;font-size:1.05rem}.pass header span{margin-left:auto;font-size:.8rem;opacity:.9}
.pass header svg{background:#fff;border-radius:50%;padding:2px}
.codes{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0}
.codes b{display:block;font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1}.codes small{color:var(--muted)}.codes .r{text-align:right}
.pass .facts{padding:0 16px}
.tear{position:relative;height:22px;margin:4px 0}.tear::before{content:"";position:absolute;left:14px;right:14px;top:10px;border-top:2px dashed var(--line)}
.tear::after{content:"";position:absolute;inset:0 -11px;background:radial-gradient(circle at 0 50%,var(--bg) 10px,transparent 11px),radial-gradient(circle at 100% 50%,var(--bg) 10px,transparent 11px)}
.pass .row,.pass .seg,.pass>p,.pass .link{margin-left:16px;margin-right:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
.step{display:flex;align-items:center;gap:12px}.step b{font-family:var(--display);font-weight:800;font-size:1.4rem;min-width:1.4em;text-align:center}
.step button{width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:1.3rem;font-weight:600}.step button:disabled{opacity:.35}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.seg button{border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:6px 4px;font-weight:600;font-size:.9rem}.seg button small{display:block;font-weight:400;font-size:.78rem}
.seg button.on{background:var(--c);border-color:var(--c);color:#fff}
.cabin{display:flex;flex-direction:column;gap:6px;margin:12px 16px 4px;padding:9px 34px 9px 12px;border-radius:12px 60px 60px 12px;background:var(--bg);border:2px solid var(--line)}
.cab{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;grid-template-rows:repeat(var(--r),auto);gap:2px}
.cab i{aspect-ratio:1;border-radius:2px 2px 1px 1px;background:var(--line)}.cab i.f{background:var(--c)}
.profit{display:flex;justify-content:space-between;align-items:baseline;font-size:.92rem}.profit b{font-family:var(--display);font-weight:800;font-size:1.25rem}

/* hangar */
.plane-card svg.plane{display:block;width:100%;max-width:300px;height:auto;margin:0 auto 4px}
.pname{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.pname h3{font-size:1.45rem}
.pname input{font:inherit;font-size:1.1rem;font-weight:600;border:2px solid var(--lagoon);border-radius:10px;padding:5px 8px;width:11em;background:var(--bg);color:var(--ink)}
.status{display:inline-block;font-size:.85rem;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--muted)}.status.busy{background:#D6F4EF;color:#0B5E5A}
.stat{display:grid;grid-template-columns:5.2em 1fr 6.4em;gap:8px;align-items:center;margin:5px 0;font-size:.85rem}.stat small{color:var(--muted)}.stat b{text-align:right}.stat .bar div{background:var(--c)}

/* departures board */
.board{background:#0B2633;color:#FFE3A0;border-radius:18px;padding:12px;margin:8px 0 12px;box-shadow:inset 0 0 0 3px #17414F,0 6px 0 rgba(11,58,83,.15)}
.bhead{display:flex;justify-content:space-between;font-family:var(--display);font-size:1.3rem;color:#FFB627;margin-bottom:6px}
.brow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 0;border-top:1px solid #1F4C5C;font-family:var(--display);font-size:1rem;font-variant-numeric:tabular-nums;align-items:center}
.brow>span:nth-child(2){text-align:right}.brow .bsub{grid-column:1/-1;font-family:var(--body);font-size:.84rem;color:#BFD6DD}.brow .bcity{font-size:1.15rem}.brow.bh{font-family:var(--body);font-size:.74rem;color:#8FB4C0;border:0}
.brow em{grid-column:1/-1;font-style:normal;font-family:var(--body);font-size:.85rem;color:#FFB4A6}
.board .pos{color:#7BE3A6}.board .neg{color:#FF9A88}
.brow span span{display:inline-block}
.board.fresh .brow span span{animation:flapin .45s cubic-bezier(.3,1.4,.6,1) both;transform-origin:50% 50%}
@keyframes flapin{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}
.verdict{display:flex;gap:12px;align-items:center}.verdict small{color:var(--muted)}.verdict b{display:block;font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.1}
.verdict.good{border-color:#9BDCD3}.verdict.bad{border-color:#F3B3A8}
.postcard{position:relative;margin:14px 0;padding:6px;border-radius:14px;background:repeating-linear-gradient(135deg,var(--coral) 0 12px,#fff 12px 24px,var(--lagoon) 24px 36px,#fff 36px 48px)}
.postcard>small,.postcard>p{display:block;background:var(--card);margin:0;padding:0 70px 0 14px}.postcard>small{padding-top:12px;border-radius:9px 9px 0 0;color:var(--muted);font-weight:600}.postcard>p{padding-bottom:14px;border-radius:0 0 9px 9px}
.pstamp{position:absolute;top:14px;right:16px;width:50px;height:56px;background:#FFF3D1;border:2px dashed var(--sun-d);transform:rotate(6deg);display:grid;place-items:center}

/* passport */
.pcover{display:flex;gap:12px;align-items:center;background:#0E5F5C;color:#FFD98A;border-radius:18px 18px 6px 6px;padding:14px 16px;margin-top:4px;box-shadow:inset 0 0 0 3px #FFD98A55}
.pcover h2{margin:0;font-size:1.8rem;line-height:1}.pcover p{margin:2px 0 0}.pcover svg{background:#FFD98A;border-radius:50%;padding:4px}
.pintro{margin:10px 2px}
.ppage{background:var(--paper);border:2px solid var(--line);border-radius:6px;padding:12px 14px;margin:10px 0;background-image:repeating-radial-gradient(circle at 100% 0,transparent 0 14px,rgba(18,165,160,.06) 14px 15px)}
.ppage h3{margin:0 0 8px;font-size:1.25rem}.ppage h3 small{font-family:var(--body);font-size:.82rem;color:var(--muted)}.ppage.locked{opacity:.7}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px dashed var(--line);border-radius:14px;background:transparent;padding:10px 6px;min-height:150px;justify-content:center}
.slot small{display:block;color:var(--muted);font-size:.8rem}.slot.done{border-style:solid;border-color:transparent}.slot.done>span{font-size:.85rem;font-weight:600}
.ring{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;border:3px dashed var(--sun-d);color:var(--sun-d);font-family:var(--display);font-size:2rem}
.stamp{width:96px;height:96px;display:block;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stamp{mix-blend-mode:normal}}
.stxt{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.12em}.stxt.sm{font-size:9px;letter-spacing:.04em}
.stampbox{width:160px;margin:6px auto}.stampbox .stamp{width:160px;height:160px}
.thunk{animation:thunk .55s cubic-bezier(.2,1.6,.5,1) both}@keyframes thunk{0%{scale:2.4;opacity:0}60%{scale:.94;opacity:1}100%{scale:1}}

/* full-screen layers: visits and the title poster */
.full{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto}
.fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.fhead h2{margin:0;color:var(--coral);font-size:1.7rem;line-height:1.1}.where{margin:0;color:var(--muted);font-size:.9rem}
.art{border-radius:18px;overflow:hidden;margin:12px 0;border:4px solid var(--card)}.art svg{display:block;width:100%;height:auto}.stack .btn{text-align:left}
.boat{animation:sail 3s ease-in-out forwards}@keyframes sail{from{translate:150px 166px}to{translate:220px 128px;scale:.75}}
.fb{font-weight:600}.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.result{text-align:center;padding:10px 0}.result h3{color:var(--coral);font-size:1.8rem;margin:4px 0}
.full.poster{background:var(--lagoon);color:#fff;display:flex;flex-direction:column;padding-top:max(14px,env(safe-area-inset-top,0px))}
.ptitle{text-align:center;padding:6px 6px 0}
.ptitle h1{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,13vw,3.6rem);line-height:.95;margin:6px 0 8px;color:#FFF7E0;text-shadow:0 4px 0 var(--coral-d),0 8px 0 #0B3A5355}
.ptitle p{margin:0 auto;max-width:30ch;font-size:1rem}
.pposter{display:block;width:100%;height:auto;margin:14px 0 0;border-radius:24px;border:5px solid #FFF7E0}
.pbtns{text-align:center}.pbtns .btn.fly{position:static;margin-top:18px}.pbtns .muted{color:#D8F4F2}
.plang{display:inline-flex;gap:8px;align-items:center;font-weight:600;margin-top:4px}
.pp-plane{animation:none}
#toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:16px;transition:.3s;width:max-content;max-width:90%;z-index:30;pointer-events:none;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}#toast .pos{color:#7BE3A6}
.flying{display:flex;align-items:center;gap:10px}.flying p{margin:0;font-family:var(--display);font-size:1.2rem}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:13px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.pop{opacity:1}}
</style>

<script>const I18N={"fr": {"Fuel prices went up this week.": "Le prix du carburant a augmenté cette semaine.", "Fuel prices went down this week.": "Le prix du carburant a baissé cette semaine.", "July is the month of the Heiva i Tahiti: dance and song competitions bring visitors to the islands.": "Juillet est le mois du Heiva i Tahiti : les concours de danse et de chant attirent des visiteurs dans les îles.", "Humpback whales come to French Polynesia from about July to November: whale watchers book flights.": "Les baleines à bosse viennent en Polynésie française de juillet à novembre environ : les amateurs de baleines réservent des vols.", "The plane lands on <b>Motu Mute</b>, a small island on the reef of Bora Bora. How do travellers reach the main island and its village, Vaitape?": "L'avion se pose sur le <b>motu Mute</b>, un petit îlot sur le récif de Bora Bora. Comment les voyageurs rejoignent-ils l'île principale et son village, Vaitape ?", "By boat, across the lagoon": "En bateau, à travers le lagon", "Yes: a boat waits at the airport jetty and crosses the lagoon.": "Oui : un bateau attend au quai de l'aéroport et traverse le lagon.", "By the coastal road": "Par la route de ceinture", "There is no road: the motu and the main island are separated by the lagoon.": "Il n'y a pas de route : le motu et l'île principale sont séparés par le lagon.", "They walk on the reef": "À pied sur le récif", "Too far and too deep, and the reef is alive: never walk on coral.": "Trop loin, trop profond, et le récif est vivant : on ne marche jamais sur le corail.", "The United States forces, during the Second World War": "L'armée des États-Unis, pendant la Seconde Guerre mondiale", "A film studio, for a movie": "Un studio de cinéma, pour un film", "No: it is older and was built for the war.": "Non : elle est plus ancienne et a été construite pour la guerre.", "The ancient Polynesian navigators": "Les anciens navigateurs polynésiens", "The navigators came by canoe, long before planes.": "Les navigateurs venaient en pirogue, bien avant les avions.", "You landed on Motu Mute, crossed the lagoon by boat to Vaitape, and learnt that the airstrip dates from 1943.": "Vous vous êtes posé sur le motu Mute, vous avez traversé le lagon en bateau jusqu'à Vaitape et appris que la piste date de 1943.", "Punanga Nui market in Avarua is open through the week, but one morning is the big market day, with food, crafts and music. Which one?": "Le marché Punanga Nui d'Avarua est ouvert toute la semaine, mais un matin est le grand jour du marché, avec cuisine, artisanat et musique. Lequel ?", "Saturday morning": "Le samedi matin", "Yes: on Saturday morning the whole island seems to be there.": "Oui : le samedi matin, toute l'île semble être là.", "Sunday morning": "Le dimanche matin", "Sunday is a quiet day of church and family on Rarotonga.": "Le dimanche est un jour calme, d'église et de famille, à Rarotonga.", "Wednesday night": "Le mercredi soir", "Not the big day.": "Ce n'est pas le grand jour.", "How do you greet the stallholders?": "Comment saluez-vous les marchands ?", "Kia orāna!": "Kia orāna !", "Yes: “Kia orāna”, the greeting of the Cook Islands, close to the Tahitian “ʻIa ora na”.": "Oui : « Kia orāna », la salutation des îles Cook, proche du tahitien « ʻIa ora na ».", "Aloha!": "Aloha !", "That is Hawaiian.": "C'est hawaïen.", "Konnichiwa!": "Konnichiwa !", "That is Japanese.": "C'est japonais.", "You went to Punanga Nui on a Saturday morning and greeted everyone with “Kia orāna”.": "Vous êtes allé à Punanga Nui un samedi matin et vous avez salué tout le monde d’un « Kia orāna ».", "Close": "Fermer", "Well done!": "Bravo !", "People in {city} now know your airline a little better: more bookings on this route.": "À {city}, on connaît un peu mieux votre compagnie : plus de réservations sur cette ligne.", "Back to the airline": "Retour à la compagnie", "Map of the Pacific with your routes": "Carte du Pacifique avec vos lignes", "Week {n}": "Semaine {n}", "Reputation": "Réputation", "Language": "Langue", "Welcome to Faʻaʻā! You run a small airline with one island plane. Tap an island or a city on the map to open a route, then press “Fly the week”.": "Bienvenue à Faʻaʻā ! Vous dirigez une petite compagnie aérienne avec un avion des îles. Touchez une île ou une ville sur la carte pour ouvrir une ligne, puis appuyez sur « Voler la semaine ».", "Your home base, on the island of Tahiti.": "Votre base, sur l'île de Tahiti.", "{d} km from Tahiti · standard fare {f}": "À {d} km de Tahiti · tarif standard {f}", "You fly here {n} times a week.": "Vous volez ici {n} fois par semaine.", "Open a route with {p}": "Ouvrir une ligne avec {p}", "Your free planes cannot fly that far. Lease a plane with a longer range in the Fleet tab.": "Vos avions libres ne peuvent pas aller si loin. Louez un avion d'un plus grand rayon d'action dans l'onglet Flotte.", "All your planes are busy. Lease another plane in the Fleet tab.": "Tous vos avions sont occupés. Louez un autre avion dans l'onglet Flotte.", "Visit {city}": "Visiter {city}", "Fly the week": "Voler la semaine", "No route yet. Open one from the map.": "Pas encore de ligne. Ouvrez-en une depuis la carte.", "seats": "sièges", "Flights a week": "Vols par semaine", "Price": "Prix", "Expected: {pax} passengers for {seats} seats ({load} % full) · profit {pr}": "Prévu : {pax} passagers pour {seats} sièges (rempli à {load} %) · bénéfice {pr}", "Close this route": "Fermer cette ligne", "{s} seats · range {r} km · lease {l} a week": "{s} sièges · rayon d'action {r} km · location {l} par semaine", "Flies to {city}": "Vole vers {city}", "Waiting at Faʻaʻā": "En attente à Faʻaʻā", "Give it back (half the deposit returned)": "Le rendre (la moitié de la caution est remboursée)", "Lease a plane": "Louer un avion", "{s} seats · range {r} km · {v} km/h": "{s} sièges · rayon d'action {r} km · {v} km/h", "Deposit {d} · then {l} a week": "Caution {d} · puis {l} par semaine", "Lease": "Louer", "No week flown yet.": "Aucune semaine de vol pour le moment.", "{pax} passengers · {load} % full": "{pax} passagers · rempli à {load} %", "{n} flights cancelled: a cyclone warning.": "{n} vols annulés : alerte cyclonique.", "Plane leases": "Location des avions", "Result of the week": "Résultat de la semaine", "CO₂ this week: about {t} tonnes. Full planes and the right plane size mean less CO₂ per passenger.": "CO₂ cette semaine : environ {t} tonnes. Des avions pleins et de la bonne taille, c'est moins de CO₂ par passager.", "Each country you fly to can be visited. What the manu learns there brings you more passengers.": "Chaque pays desservi peut être visité. Ce que le manu y apprend vous amène plus de passagers.", "Open a route to {city} to visit.": "Ouvrez une ligne vers {city} pour la visiter.", "Visits here are coming in a next version.": "Les visites ici arrivent dans une prochaine version.", "New route: Tahiti ⇄ {city}!": "Nouvelle ligne : Tahiti ⇄ {city} !", "A new {p} joins the fleet!": "Nouvel avion dans la flotte : {p} !", "The planes are flying…": "Les avions volent…", "A good week: {p}": "Une bonne semaine : {p}", "A hard week: {p}. Try other prices or plane sizes.": "Une semaine difficile : {p}. Essayez d'autres prix ou d'autres tailles d'avion.", "Tahiti": "Tahiti", "Faʻaʻā": "Faʻaʻā", "French Polynesia": "Polynésie française", "Bora Bora": "Bora Bora", "Motu Mute": "Motu Mute", "Rarotonga": "Rarotonga", "Avarua": "Avarua", "Cook Islands": "Îles Cook", "Auckland": "Auckland", "Tāmaki Makaurau": "Tāmaki Makaurau", "Aotearoa New Zealand": "Aotearoa Nouvelle-Zélande", "Honolulu": "Honolulu", "Oʻahu": "Oʻahu", "Hawaiʻi, USA": "Hawaïi, États-Unis", "Island hopper": "Avion des îles", "turboprop": "turbopropulseur", "Pacific jet": "Jet du Pacifique", "narrow-body jet": "avion à couloir unique", "Ocean liner": "Long-courrier de l'océan", "wide-body jet": "gros-porteur", "Saver": "Éco", "Standard": "Standard", "High": "Haut", "Landing on a motu": "Atterrir sur un motu", "The airport in the lagoon": "L'aéroport dans le lagon", "Punanga Nui market": "Le marché Punanga Nui", "Saturday in Avarua": "Un samedi à Avarua", "January": "janvier", "February": "février", "March": "mars", "April": "avril", "May": "mai", "June": "juin", "July": "juillet", "August": "août", "September": "septembre", "October": "octobre", "November": "novembre", "December": "décembre", "Who built the airstrip of Bora Bora?": "Qui a construit la piste de Bora Bora ?", "Yes: the construction battalions of the US Navy, the Seabees, built it in early 1943, when Bora Bora was a supply base in the Pacific. Airline flights began in 1958.": "Oui : les bataillons de construction de la marine américaine, les Seabees, l'ont construite au début de 1943, quand Bora Bora était une base de ravitaillement dans le Pacifique. Les vols commerciaux ont commencé en 1958.", "Map": "Carte", "Routes": "Lignes", "Fleet": "Flotte", "Report": "Bilan", "Visits": "Visites", "A new stamp in your passport! People in {city} now know your airline a little better: more bookings on this route.": "Un nouveau tampon dans votre passeport ! À {city}, on connaît maintenant un peu mieux votre compagnie : plus de réservations sur cette ligne.", "Equator": "Équateur", "Pacific Ocean": "Océan Pacifique", "Humpback whales are here (July to November).": "Les baleines à bosse sont là (de juillet à novembre).", "Cyclone season: some flights may be cancelled (about November to April).": "Saison des cyclones : certains vols peuvent être annulés (environ de novembre à avril).", "Passport": "Passeport", "{h} h {m} min": "{h} h {m} min", "{h} h": "{h} h", "Week {n}, {y}": "Semaine {n}, {y}", "Money": "Argent", "Planes in your fleet: {n}": "Avions dans votre flotte : {n}", "Distance": "Distance", "Standard fare": "Tarif standard", "Flight time": "Durée du vol", "Go to the map": "Aller à la carte", "Boarding pass": "Carte d’embarquement", "Plane": "Avion", "Fewer flights": "Moins de vols", "More flights": "Plus de vols", "Expected: {pax} passengers for {seats} seats ({load} % full)": "Prévu : {pax} passagers pour {seats} sièges (rempli à {load} %)", "Expected result of the week": "Résultat prévu de la semaine", "Your hangar": "Votre hangar", "Plane name": "Nom de l’avion", "Save": "Enregistrer", "Rename": "Renommer", "Seats": "Sièges", "Range": "Autonomie", "Speed": "Vitesse", "You need {d}": "Il vous faut {d}", "Departures": "Départs", "To": "Destination", "Result": "Résultat", "Squawk! Some planes were almost full. Passengers love a lively cabin.": "Cui-cui ! Certains avions étaient presque pleins. Les passagers adorent une cabine animée.", "A good week. The money adds up!": "Une bonne semaine. Les comptes sont bons !", "A hard week. Try other prices, fewer flights or a smaller plane.": "Une semaine difficile. Essayez d’autres prix, moins de vols ou un avion plus petit.", "News of the week": "Nouvelles de la semaine", "Stamps: {n} of {all}": "Tampons : {n} sur {all}", "Goal reached!": "Objectif atteint !", "Every goal reached. Bravo, captain!": "Tous les objectifs sont atteints. Bravo, commandant !", "Next goal ({n} of {all} done)": "Prochain objectif ({n} sur {all} atteints)", "Planes about 70 to 97 % full make passengers happy and bring you stars.": "Des avions remplis à environ 70 à 97 % rendent les passagers heureux et vous rapportent des étoiles.", "A bigger plane is not always better: empty seats still burn fuel.": "Un plus gros avion n’est pas toujours mieux : les sièges vides brûlent aussi du carburant.", "Visit the places you fly to. People there will want to fly with you.": "Visitez les endroits où vous volez. Les gens de là-bas voudront voyager avec vous.", "Saver prices fill the plane. High prices fill the till, but cost a little reputation. Try both!": "Le prix « Éco » remplit l’avion. Le prix « Haut » remplit la caisse, mais coûte un peu de réputation. Essayez les deux !", "From November to April, cyclones can cancel some flights. Keep some savings.": "De novembre à avril, les cyclones peuvent annuler des vols. Gardez des économies.", "I can fly by myself, but the passengers prefer the plane.": "Moi, je sais voler tout seul, mais les passagers préfèrent l’avion.", "Seat 1A is mine. Window, please!": "Le siège 1A, c’est le mien. Côté hublot, s’il vous plaît !", "My feathers are the livery. Very economical.": "Mes plumes servent de livrée. Très économique.", "In the hangar, tap “Rename” to give a plane its own name.": "Dans le hangar, touchez « Renommer » pour donner un nom à un avion.", "ʻIa ora na! I am the manu, and this is our little airline. Tap Bora Bora on the map and open our first route.": "ʻIa ora na ! Je suis le manu, et voici notre petite compagnie. Touchez Bora Bora sur la carte et ouvrez notre première ligne.", "Some planes flew almost empty. Try fewer flights, a smaller plane or a Saver price.": "Certains avions ont volé presque vides. Essayez moins de vols, un plus petit avion ou le prix « Éco ».", "Next tip from the manu": "Conseil suivant du manu", "A little airline from Tahiti. Open routes across the Pacific, and visit every country you connect.": "Une petite compagnie aérienne de Tahiti. Ouvrez des lignes à travers le Pacifique et visitez chaque pays que vous reliez.", "Continue": "Continuer", "Start your airline": "Lancer votre compagnie", "Version {v}": "Version {v}", "Open your first route": "Ouvrir votre première ligne", "Fly {n} passengers": "Transporter {n} passagers", "Get your first passport stamp": "Obtenir votre premier tampon de passeport", "Lease a second plane": "Louer un deuxième avion", "Open a route to another country": "Ouvrir une ligne vers un autre pays", "Reach a reputation of {n} stars": "Atteindre une réputation de {n} étoiles", "Collect every stamp of the passport": "Collectionner tous les tampons du passeport", "Title screen and language": "Écran titre et langue"}};
/* ===================== Manu Tere Nui 0.1.2 · core: helpers, state, save, i18n, drawings =====================
   Every visible string goes through t('…'): the English text is the key; tools/i18n/extract.py lists them,
   project/i18n/<lang>.json holds the translations (the build embeds them as I18N). Placeholders: {name}.
   Drawings are SVG made by code: the manu (with moods), the planes in the Manu Tere Nui livery (no real airline,
   no manufacturer: a white body, a lagoon stripe, a lagoon tail with the red bird), and the small icons. */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const a2f=n=>String(Math.round(n*10)/10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function seeded(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
const VERSION='0.1.2';
const LANGS={en:'English', fr:'Français'};
function t(s,o){ const L=(typeof I18N!=='undefined'&&S&&I18N[S.lang])||null; let r=(L&&L[s])||s; if(o) r=r.replace(/\{(\w+)\}/g,(m,k)=>o[k]!==undefined?o[k]:m); return r; }
const SAVE_KEY='manuterenui.v1';
let S=null;
function newState(){ return { v:1, lang:(navigator.language||'en').slice(0,2)==='fr'?'fr':'en', week:1, money:200000, rep:50, fuel:1,
  fleet:[{id:'p1', cls:'hopper', name:'Manu 1'}], routes:[], opened:{}, visits:{}, last:null, tab:'map', seen:{}, next:2,
  paxTotal:0, goals:{}, started:false, tip:0 }; }
/* fields added after 0.1 get their default here, so old saves keep working */
function normalize(s){ const d=newState(); Object.keys(d).forEach(k=>{ if(s[k]===undefined) s[k]=d[k]; }); if(s.routes.length||s.week>1) s.started=true; return s; }
function load(){ try{ const j=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); S=j&&j.v===1?normalize(j):newState(); }catch(e){ S=newState(); } }
function save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }catch(e){} }
const LOC=()=>S&&S.lang==='fr'?'fr-FR':'en-US';
/* French groups thousands with U+202F, which the embedded fonts lack: use a no-break space instead */
function num(n){ return Math.round(n).toLocaleString(LOC()).replace(/\u202f/g,'\u00a0'); }
function fmt(n){ const r=Math.round(n); return (r<0?'−':'')+'₱\u00a0'+num(Math.abs(r)); }
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthOf(w){ return Math.floor(((w-1)%52)/52*12); }
function yearOf(w){ return 2027+Math.floor((w-1)/52); }
function toast(html,ms){ const el=$('#toast'); el.innerHTML=html; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),ms||2600); }
const REDUCED=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* the manu, a small red bird facing right; mood: 'ok' (default), 'happy' (eyes closed in a smile, wings up), 'sad', 'wow' */
function manuSVG(s,mood){ mood=mood||'ok';
  const eye=mood==='happy'?`<path d="M8.6 -11.2 Q11 -14 13.4 -11.2" stroke="#0B3A53" stroke-width="1.8" fill="none" stroke-linecap="round"/>`
    :mood==='sad'?`<circle cx="11" cy="-10.6" r="1.9" fill="#0B3A53"/><path d="M8 -15 L13.6 -13.4" stroke="#0B3A53" stroke-width="1.4" stroke-linecap="round"/>`
    :`<circle cx="11" cy="-11" r="2.3" fill="#0B3A53"/><circle cx="11.8" cy="-11.8" r=".8" fill="#FFFFFF"/>`+(mood==='wow'?`<circle cx="11" cy="-11" r="3.6" fill="none" stroke="#0B3A53" stroke-width=".8"/>`:'');
  const wing=mood==='happy'?`<path d="M-4 -4 Q-14 -24 -24 -16 Q-16 -10 -8 2Z" fill="#C7362A"/>`:mood==='sad'?`<path d="M-4 0 Q-16 4 -20 12 Q-10 10 -2 6Z" fill="#C7362A"/>`:`<path d="M-6 -3 Q-19 -11 -23 1 Q-13 4 -4 4Z" fill="#C7362A"/>`;
  const beak=mood==='wow'?`<path d="M16.5 -11 L24 -10 L16.5 -6.5Z M17 -8 L22 -5 L16.5 -5Z" fill="#FFB627"/>`:`<path d="M16.5 -11.5 L25 -8.6 L16.5 -6Z" fill="#FFB627"/>`;
  return `<g transform="scale(${s||1})"><path d="M-12 4 L-26 10 L-22 4 L-27 0 L-12 0Z" fill="#C7362A"/><ellipse cx="0" cy="0" rx="14" ry="11.5" fill="#EF4F3A"/><ellipse cx="2" cy="4" rx="8" ry="5.5" fill="#FF8A6B" opacity=".7"/><circle cx="9" cy="-9" r="8.6" fill="#EF4F3A"/><path d="M4 -17 Q6 -22 9 -17.5 Q11 -22 13 -17" stroke="#C7362A" stroke-width="2" fill="none" stroke-linecap="round"/>${eye}<circle cx="13.5" cy="-6" r="2" fill="#FF8FA3" opacity=".8"/>${beak}${wing}<path d="M-3 10.5 l-2 7 M3 10.5 l1.5 7" stroke="#FFB627" stroke-width="2.2" stroke-linecap="round"/></g>`; }

/* a plane seen from the side, nose to the right, in the airline's livery. cls: hopper | jet | liner */
function planeSVG(cls,opts){ opts=opts||{}; const L={hopper:132,jet:158,liner:184}[cls]||150, h=cls==='liner'?19:cls==='jet'?16:14, a=8, b=a+L, y=40, top=y-h/2, bot=y+h/2;
  const prop=cls==='hopper';
  let s=`<ellipse cx="${(a+b)/2}" cy="${bot+12}" rx="${L*.42}" ry="3" fill="#0B3A53" opacity=".12"/>`;
  if(!prop) s+=`<path d="M${a+L*.42} ${y+1} L${a+L*.3} ${y+8} L${a+L*.62} ${y+8} L${a+L*.6} ${y+1}Z" fill="#9FB7C2"/>`;
  s+=`<path d="M${a+2} ${top+2} L${a-4} ${top-24} L${a+10} ${top-24} L${a+L*.2} ${top}Z" fill="#12A5A0"/><g transform="translate(${a+5} ${top-14}) scale(.32)">${manuSVG(1)}</g>`
    +`<path d="M${a-2} ${y} L${a+16} ${y-1} L${a+18} ${y+2} L${a-2} ${y+3}Z" fill="#0E8C88"/>`
    +`<path d="M${a} ${top+3} Q${a} ${top} ${a+8} ${top} L${b-22} ${top} Q${b-2} ${top} ${b+3} ${y+2} Q${b} ${bot} ${b-16} ${bot} L${a+20} ${bot} Q${a+6} ${bot} ${a} ${y+2}Z" fill="#FFFFFF" stroke="#0B3A53" stroke-width="1.4"/>`
    +`<path d="M${a+6} ${y+4} L${b-6} ${y+4}" stroke="#12A5A0" stroke-width="2.6"/><path d="M${a+10} ${y+7.2} L${b-14} ${y+7.2}" stroke="#EF4F3A" stroke-width="1.2"/>`
    +`<path d="M${b-14} ${top+3.5} L${b-4} ${top+3.5} L${b} ${y-1} L${b-15} ${y-1}Z" fill="#0B3A53"/>`;
  for(let x=a+24;x<b-24;x+=prop?8:7) s+=`<rect x="${x}" y="${top+4}" width="3.6" height="${h>16?5:4}" rx="1.6" fill="#7FD3D0"/>`;
  s+=`<rect x="${b-30}" y="${top+3}" width="6" height="${h-6}" rx="1.4" fill="none" stroke="#9FB7C2" stroke-width="1"/>`;
  if(prop){ const wx=a+L*.52; s+=`<path d="M${wx-26} ${top-1} L${wx+30} ${top-1} L${wx+26} ${top+2} L${wx-22} ${top+2}Z" fill="#0E8C88"/><rect x="${wx+6}" y="${top-2}" width="20" height="8" rx="4" fill="#DCE8EC" stroke="#0B3A53" stroke-width="1"/>`
    +`<g transform="translate(${wx+28} ${top+2})"><ellipse rx="1.6" ry="11" fill="#0B3A53" opacity=".55"${opts.spin?'':''}>${opts.spin&&!REDUCED()?'<animateTransform attributeName="transform" type="scale" values="1 1;1 -1;1 1" dur=".18s" repeatCount="indefinite"/>':''}</ellipse><circle r="2.4" fill="#EF4F3A"/></g>`; }
  else { const ex=a+L*.44; s+=`<rect x="${ex}" y="${bot+1}" width="${cls==='liner'?30:24}" height="${cls==='liner'?10:8}" rx="4.5" fill="#DCE8EC" stroke="#0B3A53" stroke-width="1"/><rect x="${ex+3}" y="${bot+3}" width="4" height="${cls==='liner'?6:4}" rx="1" fill="#12A5A0"/>`; }
  s+=`<path d="M${a+L*.5} ${bot} v5 M${b-24} ${bot} v5" stroke="#0B3A53" stroke-width="1.4"/><circle cx="${a+L*.5}" cy="${bot+6}" r="2.6" fill="#0B3A53"/><circle cx="${b-24}" cy="${bot+6}" r="2.2" fill="#0B3A53"/>`;
  return `<svg viewBox="-6 6 ${L+24} 62" class="plane" role="img" aria-label="${esc(t(PLANES[cls].name))}">${s}</svg>`; }

/* small line icons for the bottom bar */
const ICON={
  map:`<path d="M3 6 L9 4 L15 6 L21 4 V18 L15 20 L9 18 L3 20Z M9 4 V18 M15 6 V20"/>`,
  routes:`<circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M6.5 16.5 Q8 6 17.5 7.5" stroke-dasharray="2.4 2.4"/>`,

const AIRPORTS={

/* plane classes, not brands (no manufacturer names): seats, range km, cruise km/h, deposit, lease per week, cost per km flown,
   fee per landing, fuel kg per km (placeholders to be checked) */
const PLANES={
  hopper:{name:'Island hopper', kind:'turboprop', seats:70, range:1500, speed:500, deposit:60000, lease:25000, perKm:6, landing:600, fuelKm:2.2, color:'#12A5A0'},
  jet:{name:'Pacific jet', kind:'narrow-body jet', seats:180, range:6500, speed:830, deposit:350000, lease:60000, perKm:14, landing:3000, fuelKm:3.4, color:'#EF4F3A'},
  liner:{name:'Ocean liner', kind:'wide-body jet', seats:300, range:14000, speed:900, deposit:900000, lease:140000, perKm:24, landing:6000, fuelKm:6.5, color:'#6C4AB6'} };
const PRICES={saver:{name:'Saver', f:.8, d:1.35}, std:{name:'Standard', f:1, d:1}, high:{name:'High', f:1.25, d:.7}};
const HOURS_PER_WEEK=100, TURN_H=1;
function km(a,b){ const A=AIRPORTS[a], B=AIRPORTS[b], R=6371, r=Math.PI/180, dLat=(B.lat-A.lat)*r, dLon=(B.lon-A.lon)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(A.lat*r)*Math.cos(B.lat*r)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function fareOf(dest){ return Math.round((60+.16*km('PPT',dest))/5)*5; }
function roundTripHours(dest,cls){ return 2*km('PPT',dest)/PLANES[cls].speed+2*TURN_H; }
function maxFreq(dest,cls){ return Math.max(0,Math.floor(HOURS_PER_WEEK/roundTripHours(dest,cls))); }

/* ===================== Manu Tere Nui 0.1.2 · the week: demand, passengers, money, events =====================
   One route = return flights from Tahiti; freq = return flights per week; passengers both ways counted together.
   demand = base × season(month) × price effect × reputation × known-country bonus; passengers = min(demand, seats).
   Cyclone season (about November to April in the South Pacific): a small chance that a flight-week is cut by weather. */
const EVENTS=[
  {id:'fuelup', p:.12, run:()=>{ S.fuel=clamp(S.fuel+.08,.8,1.3); return t('Fuel prices went up this week.'); }},
  {id:'fueldown', p:.12, run:()=>{ S.fuel=clamp(S.fuel-.07,.8,1.3); return t('Fuel prices went down this week.'); }},
  {id:'heiva', p:1, when:w=>monthOf(w)===6&&!S.seen['heiva'+yearOf(w)], run:w=>{ S.seen['heiva'+yearOf(w)]=1; return t('July is the month of the Heiva i Tahiti: dance and song competitions bring visitors to the islands.'); }},
  {id:'whales', p:1, when:w=>monthOf(w)===7&&!S.seen['whales'+yearOf(w)], run:w=>{ S.seen['whales'+yearOf(w)]=1; return t('Humpback whales come to French Polynesia from about July to November: whale watchers book flights.'); }} ];
function knownBonus(dest){ const v=S.visits[dest]||{}; return 1+Math.min(.2,Object.keys(v).length*.05); }
function repFactor(){ return .7+S.rep/100*.6; }
function estimate(r){ const A=AIRPORTS[r.dest], P=PLANES[planeOf(r).cls], pr=PRICES[r.price], m=monthOf(S.week);
  const demand=Math.round(A.demand*A.season[m]*pr.d*repFactor()*knownBonus(r.dest)), seats=r.freq*P.seats*2, pax=Math.min(demand,seats);
  const dist=km('PPT',r.dest), fare=fareOf(r.dest)*pr.f, flown=r.freq*2*dist;
  const cost=flown*P.perKm*S.fuel+r.freq*2*P.landing, revenue=pax*fare, co2=flown*P.fuelKm*3.16/1000;
  return {demand,seats,pax,load:seats?pax/seats:0,revenue,cost,co2}; }
function planeOf(r){ return S.fleet.find(p=>p.id===r.plane); }
function flyWeek(){ const m=monthOf(S.week), rep={week:S.week, routes:[], lease:0, events:[]};
  S.routes.forEach(r=>{ const e=estimate(r), A=AIRPORTS[r.dest];
    const cyclone=(m>=10||m<=3)&&Math.random()<.06*A.cyc;
    if(cyclone){ const lost=Math.ceil(r.freq/2); const k=(r.freq-lost)/r.freq; e.pax=Math.round(e.pax*k); e.revenue*=k; e.cost*=k; e.co2*=k; e.cancel=lost; }
    rep.routes.push(Object.assign({dest:r.dest, freq:r.freq}, e)); });
  S.fleet.forEach(p=>{ rep.lease+=PLANES[p.cls].lease; });
  const rev=rep.routes.reduce((a,b)=>a+b.revenue,0), cost=rep.routes.reduce((a,b)=>a+b.cost,0)+rep.lease;
  rep.revenue=rev; rep.cost=cost; rep.profit=rev-cost; rep.co2=rep.routes.reduce((a,b)=>a+b.co2,0); rep.pax=rep.routes.reduce((a,b)=>a+b.pax,0); S.paxTotal=(S.paxTotal||0)+rep.pax;
  /* reputation: well-filled planes help, empty ones and cancellations hurt, high prices a little */
  rep.routes.forEach(x=>{ if(x.cancel) S.rep-=3; else if(x.load>=.7&&x.load<=.97) S.rep+=1; else if(x.load<.4) S.rep-=1; });
  S.routes.forEach(r=>{ if(r.price==='high') S.rep-=.5; }); S.rep=clamp(Math.round(S.rep),0,100);
  EVENTS.forEach(ev=>{ if((!ev.when||ev.when(S.week))&&Math.random()<ev.p) rep.events.push(ev.run(S.week)); });
  S.money+=rep.profit; S.last=rep; S.week++; save(); return rep; }

/* ===================== Manu Tere Nui 0.1.2 · the living Pacific map =====================
   Equirectangular, Pacific-centred (MAP from 05-mapdata.js: 4 px per degree from 110°E), shown cropped to the region of
   the game (about 45°N to 45°S, 120°E to 80°W). Small islands are not in the 1:110m land layer, so island airports get a
   drawn island with its reef. Routes are great circles (slerp).
   Seasonal signs use facts already in the game (03-sim.js): humpback whales near French Polynesia about July to
   November; South Pacific cyclone season about November to April. The swirl is a symbol, not a real storm track.
   Checked 27 Oct 2026: Tahiti Tourisme "Whales" (tahititourisme.com/activities/diving/maritime-species/whales/); service-public.pf DPAM
   "Saison cyclonique" (season 1 Nov to 30 Apr, peak January to March). */
const VIEW={x:40,y:30,w:600,h:380};
function lon360(l){ l=(l+360)%360; return l<MAP.lon0?l+360:l; }
function P(lat,lon){ return [(lon360(lon)-MAP.lon0)*MAP.k, (MAP.lat0-lat)*MAP.k]; }
function gcPts(a,b,n){ const A=AIRPORTS[a], B=AIRPORTS[b], r=Math.PI/180, v=(lat,lon)=>[Math.cos(lat*r)*Math.cos(lon*r),Math.cos(lat*r)*Math.sin(lon*r),Math.sin(lat*r)];
  const p=v(A.lat,A.lon), q=v(B.lat,B.lon), d=Math.acos(clamp(p[0]*q[0]+p[1]*q[1]+p[2]*q[2],-1,1)); const pts=[];
  for(let i=0;i<=n;i++){ const f=i/n, s1=Math.sin((1-f)*d)/Math.sin(d), s2=Math.sin(f*d)/Math.sin(d); const x=s1*p[0]+s2*q[0], y=s1*p[1]+s2*q[1], z=s1*p[2]+s2*q[2];
    pts.push(P(Math.atan2(z,Math.hypot(x,y))/r, Math.atan2(y,x)/r)); }
  return pts; }
function gcPath(a,b,n){ return 'M'+gcPts(a,b,n).map(p=>a2f(p[0])+' '+a2f(p[1])).join(' L'); }
const isle=(x,y,s)=>`<g transform="translate(${a2f(x)} ${a2f(y)}) scale(${s})"><ellipse rx="9" ry="6" fill="#9BE7DF" opacity=".75"/><ellipse rx="9" ry="6" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 1.5" opacity=".9"/><path d="M-4 1 Q-3 -3 0 -3 Q4 -3 4 1 Q0 3 -4 1Z" fill="#3E9A5A"/></g>`;
function mapSVG(opts){ opts=opts||{}; const sel=opts.sel, R=opts.anim, m=monthOf(S.week), still=REDUCED();
  let s=`<defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FE0EA"/><stop offset=".55" stop-color="#4FB9CF"/><stop offset="1" stop-color="#2A8DB3"/></linearGradient>
    <pattern id="waves" width="28" height="14" patternUnits="userSpaceOnUse"><path d="M0 7 Q7 3 14 7 T28 7" fill="none" stroke="#FFFFFF" stroke-width=".7" opacity=".28"/></pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="0" flood-color="#0B3A53" flood-opacity=".18"/></filter></defs>
    <rect x="${VIEW.x}" y="${VIEW.y}" width="${VIEW.w}" height="${VIEW.h}" fill="url(#sea)"/><rect x="${VIEW.x}" y="${VIEW.y}" width="${VIEW.w}" height="${VIEW.h}" fill="url(#waves)"/>`;
  s+=`<path d="M${VIEW.x} ${MAP.lat0*MAP.k} H${VIEW.x+VIEW.w}" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="6 6" opacity=".5"/><text x="${VIEW.x+8}" y="${MAP.lat0*MAP.k-5}" class="mlbl small">${t('Equator')}</text>`;
  s+=`<path d="${MAP.land}" fill="#F3D9A4" stroke="#FFF6E0" stroke-width="5" stroke-linejoin="round" opacity=".55"/><path d="${MAP.land}" fill="#8CC57A" stroke="#5E9E58" stroke-width="1" filter="url(#shadow)"/>`;
  s+=`<text x="470" y="236" class="mlbl ocean">${t('Pacific Ocean')}</text>`;
  /* compass rose */
  s+=`<g transform="translate(86 372)" class="compass"><circle r="20" fill="#FFFFFF" opacity=".35"/><path d="M0 -18 L4 0 L0 18 L-4 0Z" fill="#0B3A53"/><path d="M0 -18 L4 0 L-4 0Z" fill="#EF4F3A"/><path d="M-18 0 L0 -3 L18 0 L0 3Z" fill="#0B3A53" opacity=".6"/><text y="-23" class="mlbl small" text-anchor="middle">N</text></g>`;
  /* clouds drifting */
  [[150,110,1],[520,300,.8],[300,190,.7]].forEach(([x,y,k],i)=>{ s+=`<g class="cloud c${i}" transform="translate(${x} ${y}) scale(${k})"><path d="M-22 6 Q-24 -4 -12 -4 Q-8 -14 4 -10 Q16 -14 18 -2 Q28 0 24 6Z" fill="#FFFFFF" opacity=".85"/></g>`; });
  /* seasons */
  if(m>=6&&m<=10){ const [x,y]=P(-19.5,-141.5); s+=`<g class="whale" transform="translate(${a2f(x)} ${a2f(y)}) scale(1.5)"><title>${t('Humpback whales are here (July to November).')}</title><path d="M0 0 Q-2 -7 -9 -9 Q-5 -4 -1 -2 Q0 -6 1 -2 Q5 -4 9 -9 Q2 -7 0 0Z" fill="#2E4A66"/><path d="M-10 3 Q0 0 10 3" stroke="#FFFFFF" stroke-width="1.2" fill="none" opacity=".8"/></g>`; }
  if(m>=10||m<=3){ const [x,y]=P(-13.5,-170); s+=`<g transform="translate(${a2f(x)} ${a2f(y)})"><title>${t('Cyclone season: some flights may be cancelled (about November to April).')}</title><g class="swirl"><path d="M0 0 Q8 -12 18 -4 M0 0 Q12 8 4 18 M0 0 Q-8 12 -18 4 M0 0 Q-12 -8 -4 -18" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/><circle r="3" fill="#FFFFFF"/></g></g>`; }
  /* routes */
  S.routes.forEach(r=>{ const p=planeOf(r), d=gcPath('PPT',r.dest,48); s+=`<path d="${d}" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".7"/><path class="route${still?'':' flow'}" d="${d}" fill="none" stroke="${PLANES[p.cls].color}" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 6"/>`; });
  /* airports */
  Object.keys(AIRPORTS).forEach(k=>{ const A=AIRPORTS[k], [x,y]=P(A.lat,A.lon); if(A.isle) s+=isle(x,y,A.hub?1.2:1); });
  Object.keys(AIRPORTS).forEach(k=>{ const A=AIRPORTS[k], [x,y]=P(A.lat,A.lon), open=A.hub||S.opened[k], on=sel===k, L=A.lbl||[9,5,'start'];
    const col=A.hub?'#EF4F3A':open?'#0B3A53':'#FFFFFF', ring=A.hub?'#FFFFFF':open?'#FFB627':'#0B3A53';
    s+=`<g class="apt${on?' on':''}" data-a="${k}" role="button" tabindex="0" aria-label="${esc(t(A.city))}"><circle cx="${a2f(x)}" cy="${a2f(y)}" r="15" fill="#FFFFFF" fill-opacity=".001"/>`
      +(on?`<circle cx="${a2f(x)}" cy="${a2f(y)}" r="11" fill="none" stroke="#FFB627" stroke-width="2.4" class="pulse"/>`:'')
      +`<circle cx="${a2f(x)}" cy="${a2f(y)}" r="${A.hub?6.5:5}" fill="${col}" stroke="${ring}" stroke-width="2"${open?'':' stroke-dasharray="2.2 1.6"'}/>`
      +`<text x="${a2f(x+L[0])}" y="${a2f(y+L[1])}" text-anchor="${L[2]}" class="mlbl${open?'':' closed'}">${esc(t(A.city))}</text></g>`; });
  /* the manu waits at home, or cheers while the planes fly */
  const [hx,hy]=P(AIRPORTS.PPT.lat,AIRPORTS.PPT.lon); s+=`<g transform="translate(${a2f(hx+22)} ${a2f(hy+36)})" class="${R?'hop':''}">${manuSVG(.75,R?'happy':'ok')}</g>`;
  /* the week in motion: each plane flies out and back along its route, leaving a contrail; passengers pop at the far end */
  if(R) S.routes.forEach((r,i)=>{ const p=planeOf(r), c=PLANES[p.cls].color, d=gcPath('PPT',r.dest,48), x=R.routes.find(z=>z.dest===r.dest)||{}, [ex,ey]=P(AIRPORTS[r.dest].lat,AIRPORTS[r.dest].lon), b=(i*.3).toFixed(1);
    s+=`<path d="${d}" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" opacity=".9">${still?'':`<animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;.5;1" dur="2.8s" begin="${b}s" fill="freeze"/>`}</path>`
      +`<g><path d="M8 0 L2 -1.4 L-1 -7 L-3.4 -7 L-1.4 -1.4 L-5.4 -1.4 L-7 -4 L-8.4 -4 L-7.2 0 L-8.4 4 L-7 4 L-5.4 1.4 L-1.4 1.4 L-3.4 7 L-1 7 L2 1.4Z" fill="#FFFFFF" stroke="${c}" stroke-width="1.4" stroke-linejoin="round" transform="scale(1.3)"/>${still?'':`<animateMotion dur="2.8s" begin="${b}s" fill="freeze" rotate="auto" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="linear" path="${d}"/>`}</g>`
      +`<text x="${a2f(ex)}" y="${a2f(ey-14)}" text-anchor="middle" class="mlbl pop" style="animation-delay:${(+b+1.2).toFixed(1)}s">${x.cancel?'⛈ ':''}+${num(x.pax||0)}</text>`; });
  return `<svg viewBox="${VIEW.x} ${VIEW.y} ${VIEW.w} ${VIEW.h}" class="map" role="img" aria-label="${t('Map of the Pacific with your routes')}">${s}</svg>`; }

/* ===================== Manu Tere Nui 0.1.2 · screens =====================
   Top bar (the manu: opens the title screen and the language choice; the calendar, money, stars); bottom bar with five tabs: Map, Routes (boarding passes),
   Fleet (the hangar), Report (a departures board), Visits (the passport and its stamps); the big "Fly the week". */
function openFull(html,cls){ const f=$('#full'); f.className='full'+(cls?' '+cls:''); f.innerHTML=html; f.hidden=false; f.scrollTop=0; const c=$('#fClose'); if(c) c.onclick=()=>{ closeFull(); render(); }; }
function closeFull(){ const f=$('#full'); f.hidden=true; f.innerHTML=''; f.className='full'; }
const TABS=()=>[['map',t('Map')],['routes',t('Routes')],['fleet',t('Fleet')],['report',t('Report')],['visits',t('Passport')]];
function freePlanes(){ return S.fleet.filter(p=>!S.routes.some(r=>r.plane===p.id)); }
function canReach(dest){ const d=km('PPT',dest); return freePlanes().filter(p=>PLANES[p.cls].range>=d); }
/* one-way flight time: cruise distance / speed + about 20 min for take-off, climb, descent and landing (game estimate).
   Checked 27 Oct 2026 against real schedules: PPT–BOB about 50 min, PPT–RAR 2 h 40 by turboprop (aeroroutes.com), PPT–AKL 5 h 20–5 h 50
   westbound (flightsfrom.com), PPT–HNL 5 h 30–5 h 45 (flight-report.com). */
function flightH(d,cls){ return d/PLANES[cls].speed+.35; }
function hm(h){ const H=Math.floor(h), M=Math.round((h-H)*60/5)*5; return M?t('{h} h {m} min',{h:H,m:M}):t('{h} h',{h:H}); }
function render(){ const m=monthOf(S.week); checkGoals();
  $('#top').innerHTML=`<button class="me" id="me" aria-label="${t('Title screen and language')}"><svg viewBox="-30 -24 58 46" width="40">${manuSVG(1,S.last&&S.last.profit<0?'sad':'ok')}</svg></button>
    <div class="cal"><b>${t(MONTHS[m])}</b><small>${t('Week {n}, {y}',{n:S.week,y:yearOf(S.week)})}</small></div>
    <div class="stats"><span class="money" title="${t('Money')}">${fmt(S.money)}</span><span class="rep" title="${t('Reputation')}"><svg viewBox="0 0 24 24" width="17" aria-hidden="true"><path d="M12 2 L14.9 8.6 L22 9.3 L16.6 14 L18.2 21 L12 17.3 L5.8 21 L7.4 14 L2 9.3 L9.1 8.6Z" fill="#FFB627" stroke="#C98A00" stroke-width="1.2" stroke-linejoin="round"/></svg>${S.rep}</span></div>`;
  $('#me').onclick=()=>showPoster();
  $('#tabs').innerHTML=TABS().map(([k,n])=>`<button class="tab${S.tab===k?' on':''}" data-t="${k}"${S.tab===k?' aria-current="page"':''}>${icon(k)}<span>${n}</span>${k==='visits'&&newStamps()?'<i class="dot"></i>':''}</button>`).join('');
  $$('#tabs [data-t]').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.t; save(); render(); window.scrollTo(0,0); });
  const v=$('#view'); v.innerHTML=({map:viewMap,routes:viewRoutes,fleet:viewFleet,report:viewReport,visits:viewVisits}[S.tab]||viewMap)();
  bindView(); }
function flyBtn(){ if(!S.routes.length) return ''; return `<button class="btn fly" id="fly"><svg viewBox="-10 -10 20 20" width="26" aria-hidden="true"><path d="M8 0 L2 -1.4 L-1 -7 L-3.4 -7 L-1.4 -1.4 L-5.4 -1.4 L-7 -4 L-8.4 -4 L-7.2 0 L-8.4 4 L-7 4 L-5.4 1.4 L-1.4 1.4 L-3.4 7 L-1 7 L2 1.4Z" fill="currentColor" transform="rotate(-20)"/></svg>${t('Fly the week')}</button>`; }

/* ---------- Map ---------- */
function viewMap(){ return `<div class="mapbox">${mapSVG({sel:S.sel})}</div>${S.sel?aptCard(S.sel):tipBubble()}${goalRibbon()}${flyBtn()}`; }
function aptCard(k){ const A=AIRPORTS[k];
  if(A.hub) return `<div class="card dest hub"><button class="x sm" data-unsel aria-label="${t('Close')}">×</button><h3>${t(A.city)}</h3><p class="muted">${t(A.place)}</p><p>${t('Your home base, on the island of Tahiti.')}</p><p class="small">${t('Planes in your fleet: {n}',{n:S.fleet.length})}</p></div>`;
  const d=Math.round(km('PPT',k)), r=S.routes.find(x=>x.dest===k), can=canReach(k), acts=(VISITS[k]||[]).length, best=Object.keys(PLANES).find(c=>PLANES[c].range>=d);
  return `<div class="card dest"><button class="x sm" data-unsel aria-label="${t('Close')}">×</button><h3>${t(A.city)}</h3><p class="muted">${t(A.country)}</p>
    <div class="facts"><div><small>${t('Distance')}</small><b>${num(d)} km</b></div><div><small>${t('Standard fare')}</small><b>${fmt(fareOf(k))}</b></div>${best?`<div><small>${t('Flight time')}</small><b>${hm(flightH(d,best))}</b></div>`:''}</div>
    <div class="chips">${Object.keys(PLANES).map(c=>`<span class="chip ${PLANES[c].range>=d?'yes':'no'}">${PLANES[c].range>=d?'✓':'✕'} ${t(PLANES[c].name)}</span>`).join('')}</div>
    ${r?`<p>${t('You fly here {n} times a week.',{n:r.freq})}</p>`:can.length?`<button class="btn primary" data-open="${k}">${t('Open a route with {p}',{p:esc(can[0].name)})}</button>`:`<p class="muted">${freePlanes().length?t('Your free planes cannot fly that far. Lease a plane with a longer range in the Fleet tab.'):t('All your planes are busy. Lease another plane in the Fleet tab.')}</p>`}
    ${S.opened[k]&&acts?`<button class="btn sun" data-tovisit="${k}">${t('Visit {city}',{city:t(A.city)})}</button>`:''}</div>`; }

/* ---------- Routes: one boarding pass per route ---------- */
/* one dot per seat of one flight, two blocks with the aisle between, filled from the front */
function seatMap(P,load){ const n=P.seats, r=n>250?8:n>120?6:4, f=Math.round(load*n), a=Math.ceil(n/2), fa=Math.ceil(f/2), blk=(m,ff)=>{ let s=''; for(let i=0;i<m;i++) s+=`<i${i<ff?' class="f"':''}></i>`; return `<div class="cab" style="--r:${r/2}">${s}</div>`; };
  return `<div class="cabin" aria-hidden="true">${blk(a,fa)}${blk(n-a,f-fa)}</div>`; }
function viewRoutes(){ if(!S.routes.length) return `<div class="card empty"><svg viewBox="-30 -24 58 46" width="70">${manuSVG(1,'wow')}</svg><p>${t('No route yet. Open one from the map.')}</p><button class="btn primary" data-t2="map">${t('Go to the map')}</button></div>`;
  return S.routes.map((r,i)=>{ const A=AIRPORTS[r.dest], p=planeOf(r), P=PLANES[p.cls], e=estimate(r), mx=maxFreq(r.dest,p.cls), d=km('PPT',r.dest), pr=e.revenue-e.cost-P.lease;
    return `<article class="pass" style="--c:${P.color}"><header><svg viewBox="-30 -24 58 46" width="26" aria-hidden="true">${manuSVG(1)}</svg><b>Manu Tere Nui</b><span>${t('Boarding pass')}</span></header>
      <div class="codes"><div><b>PPT</b><small>${t('Tahiti')}</small></div><svg viewBox="-10 -10 20 20" width="28" aria-hidden="true"><path d="M8 0 L2 -1.4 L-1 -7 L-3.4 -7 L-1.4 -1.4 L-5.4 -1.4 L-7 -4 L-8.4 -4 L-7.2 0 L-8.4 4 L-7 4 L-5.4 1.4 L-1.4 1.4 L-3.4 7 L-1 7 L2 1.4Z" fill="var(--c)"/></svg><div class="r"><b>${r.dest}</b><small>${t(A.city)}</small></div></div>
      <div class="facts"><div><small>${t('Plane')}</small><b>${esc(p.name)}</b></div><div><small>${t('Distance')}</small><b>${num(d)} km</b></div><div><small>${t('Flight time')}</small><b>${hm(flightH(d,p.cls))}</b></div></div>
      <div class="tear"></div>
      <div class="row"><span>${t('Flights a week')}</span><div class="step"><button data-f="${i}" data-d="-1" aria-label="${t('Fewer flights')}"${r.freq<=1?' disabled':''}>−</button><b>${r.freq}</b><button data-f="${i}" data-d="1" aria-label="${t('More flights')}"${r.freq>=mx?' disabled':''}>+</button></div></div>
      <div class="seg" role="group" aria-label="${t('Price')}">${Object.keys(PRICES).map(k=>`<button data-p="${i}" data-k="${k}" class="${r.price===k?'on':''}"${r.price===k?' aria-pressed="true"':''}>${t(PRICES[k].name)}<small>${fmt(fareOf(r.dest)*PRICES[k].f)}</small></button>`).join('')}</div>
      ${seatMap(P,e.load)}
      <p class="small">${t('Expected: {pax} passengers for {seats} seats ({load} % full)',{pax:num(e.pax),seats:num(e.seats),load:Math.round(e.load*100)})}</p>
      <p class="profit">${t('Expected result of the week')} <b class="${pr>=0?'pos':'neg'}">${fmt(pr)}</b></p>
      <button class="link" data-close="${i}">${t('Close this route')}</button></article>`; }).join('')+flyBtn(); }

/* ---------- Fleet: the hangar ---------- */
function statBar(lbl,v,max,txt){ return `<div class="stat"><small>${lbl}</small><div class="bar"><div style="width:${Math.round(v/max*100)}%"></div></div><b>${txt}</b></div>`; }
function viewFleet(){ const mx={seats:300,range:14000,speed:900};
  return `<h2 class="sect">${t('Your hangar')}</h2>`+S.fleet.map(p=>{ const r=S.routes.find(x=>x.plane===p.id), P=PLANES[p.cls];
    return `<div class="card plane-card" style="--c:${P.color}">${planeSVG(p.cls,{spin:!!r})}
      <div class="pname">${S.rename===p.id?`<input id="rn" maxlength="18" value="${esc(p.name)}" aria-label="${t('Plane name')}"><button class="btn sm primary inl" data-rnok="${p.id}">${t('Save')}</button>`:`<h3>${esc(p.name)}</h3><button class="link" data-rn="${p.id}">${t('Rename')}</button>`}</div>
      <p class="muted">${t(P.name)}</p><p class="small">${t('{s} seats · range {r} km · lease {l} a week',{s:P.seats,r:num(P.range),l:fmt(P.lease)})}</p>
      <p class="status ${r?'busy':''}">${r?t('Flies to {city}',{city:t(AIRPORTS[r.dest].city)}):t('Waiting at Faʻaʻā')}</p>${!r&&S.fleet.length>1?`<button class="link" data-ret="${p.id}">${t('Give it back (half the deposit returned)')}</button>`:''}</div>`; }).join('')
  +`<h2 class="sect">${t('Lease a plane')}</h2>`+Object.keys(PLANES).map(k=>{ const P=PLANES[k], poor=S.money<P.deposit;
    return `<div class="card plane-card shop" style="--c:${P.color}">${planeSVG(k)}<h3>${t(P.name)}</h3><p class="muted">${t(P.kind)}</p>
      ${statBar(t('Seats'),P.seats,mx.seats,num(P.seats))}${statBar(t('Range'),P.range,mx.range,num(P.range)+' km')}${statBar(t('Speed'),P.speed,mx.speed,num(P.speed)+' km/h')}
      <p class="small">${t('Deposit {d} · then {l} a week',{d:fmt(P.deposit),l:fmt(P.lease)})}</p><button class="btn primary sm" data-lease="${k}"${poor?' disabled':''}>${poor?t('You need {d}',{d:fmt(P.deposit)}):t('Lease')}</button></div>`; }).join(''); }

/* ---------- Report: a departures board ---------- */
function flip(txt,d0){ return [...String(txt)].map((c,i)=>`<span style="animation-delay:${(d0+i*.035).toFixed(2)}s">${c===' '?'&nbsp;':esc(c)}</span>`).join(''); }
function viewReport(){ const R=S.last; if(!R) return `<div class="card empty"><svg viewBox="-30 -24 58 46" width="70">${manuSVG(1)}</svg><p>${t('No week flown yet.')}</p></div>${flyBtn()}`;
  const fresh=!R.shown; R.shown=1; save(); const good=R.profit>=0;
  return `<div class="board${fresh&&!REDUCED()?' fresh':''}"><div class="bhead"><span>${t('Departures')}</span><span>${t('Week {n}',{n:R.week})}</span></div>
    <div class="brow bh"><span>${t('To')}</span><span>${t('Result')}</span></div>
    ${R.routes.map((x,i)=>`<div class="brow"><span class="bcity">${flip(t(AIRPORTS[x.dest].city),i*.25)}</span><span class="${x.revenue-x.cost>=0?'pos':'neg'}">${flip(fmt(x.revenue-x.cost),i*.25+.35)}</span><span class="bsub">${flip(t('{pax} passengers · {load} % full',{pax:num(x.pax),load:Math.round(x.load*100)}),i*.25+.2)}</span>${x.cancel?`<em>⛈ ${t('{n} flights cancelled: a cyclone warning.',{n:x.cancel})}</em>`:''}</div>`).join('')}
    <div class="brow"><span>${t('Plane leases')}</span><span class="neg">${fmt(-R.lease)}</span></div></div>
    <div class="card verdict ${good?'good':'bad'}"><svg viewBox="-30 -26 58 48" width="76" class="${good&&fresh?'hop':''}">${manuSVG(1,good?'happy':'sad')}</svg><div><small>${t('Result of the week')}</small><b class="${good?'pos':'neg'}">${fmt(R.profit)}</b><p>${good?(R.routes.some(x=>x.load>=.9)?t('Squawk! Some planes were almost full. Passengers love a lively cabin.'):t('A good week. The money adds up!')):t('A hard week. Try other prices, fewer flights or a smaller plane.')}</p></div></div>
    <div class="card co2"><p class="small">${t('CO₂ this week: about {t} tonnes. Full planes and the right plane size mean less CO₂ per passenger.',{t:num(R.co2)})}</p></div>
    ${R.events.map(e=>`<div class="postcard"><div class="pstamp" aria-hidden="true"><svg viewBox="-30 -24 58 46" width="40">${manuSVG(1,'happy')}</svg></div><small>${t('News of the week')}</small><p>${e}</p></div>`).join('')}${flyBtn()}`; }

/* ---------- Visits: the passport ---------- */
const STAMP_COL={BOB:'#12A5A0',RAR:'#EF4F3A',AKL:'#2E6E4E',HNL:'#6C4AB6'};
function stampsDone(){ let n=0; Object.values(S.visits).forEach(v=>n+=Object.keys(v).length); return n; }
function stampsAll(){ return Object.values(VISITS).reduce((a,b)=>a+b.length,0); }
function newStamps(){ return Object.keys(VISITS).some(k=>S.opened[k]&&VISITS[k].some(a=>!(S.visits[k]&&S.visits[k][a.id]))); }
function stampSVG(k,a,w,cls){ const c=STAMP_COL[k]||'#0B3A53', rot=((k.charCodeAt(0)+a.id.length*7)%13)-6;
  return `<svg viewBox="-50 -50 100 100" class="stamp${cls?' '+cls:''}" style="transform:rotate(${rot}deg)" role="img" aria-label="${esc(t(a.title))}"><circle r="46" fill="none" stroke="${c}" stroke-width="3"/><circle r="38" fill="none" stroke="${c}" stroke-width="1.2" stroke-dasharray="3 2"/>
    <path id="sa${k}${a.id}" d="M-33 0 A33 33 0 0 1 33 0" fill="none"/><text class="stxt" fill="${c}"><textPath href="#sa${k}${a.id}" startOffset="50%" text-anchor="middle">${esc(t(AIRPORTS[k].city))}</textPath></text>
    <g transform="translate(0 8)">${manuSVG(.9,'happy')}</g><text y="34" text-anchor="middle" class="stxt sm" fill="${c}">${t('Week {n}',{n:S.visits[k][a.id]})}</text></svg>`; }
function viewVisits(){ const ks=Object.keys(AIRPORTS).filter(k=>!AIRPORTS[k].hub);
  return `<div class="passport"><div class="pcover"><svg viewBox="-30 -24 58 46" width="54" aria-hidden="true">${manuSVG(1)}</svg><div><h2>${t('Passport')}</h2><p>${t('Stamps: {n} of {all}',{n:stampsDone(),all:stampsAll()})}</p></div></div>
    <p class="small pintro">${t('Each country you fly to can be visited. What the manu learns there brings you more passengers.')}</p>`
  +ks.map(k=>{ const A=AIRPORTS[k], L=VISITS[k]||[], open=S.opened[k], v=S.visits[k]||{};
    return `<section class="ppage${open?'':' locked'}"><h3>${t(A.city)} <small>${t(A.country)}</small></h3>${!open?`<p class="muted small">${t('Open a route to {city} to visit.',{city:t(A.city)})}</p>`:L.length?`<div class="slots">${L.map(a=>v[a.id]?`<button class="slot done" data-visit="${k}" data-id="${a.id}">${stampSVG(k,a)}<span>${t(a.title)}</span></button>`:`<button class="slot" data-visit="${k}" data-id="${a.id}"><span class="ring">?</span><span><b>${t(a.title)}</b><small>${t(a.sub)}</small></span></button>`).join('')}</div>`:`<p class="muted small">${t('Visits here are coming in a next version.')}</p>`}</section>`; }).join('')+`</div>`; }

/* ---------- actions ---------- */
function bindView(){
  $$('.apt').forEach(g=>{ g.onclick=()=>{ S.sel=g.dataset.a; render(); }; g.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); g.onclick(); } }; });
  $$('[data-unsel]').forEach(b=>b.onclick=()=>{ S.sel=null; render(); });
  $$('[data-t2]').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.t2; render(); });
  $$('[data-open]').forEach(b=>b.onclick=()=>{ const k=b.dataset.open, p=canReach(k)[0]; S.routes.push({dest:k, plane:p.id, freq:Math.min(3,maxFreq(k,p.cls)), price:'std'}); S.opened[k]=1; save(); toast(t('New route: Tahiti ⇄ {city}!',{city:t(AIRPORTS[k].city)})); render(); });
  $$('[data-tovisit]').forEach(b=>b.onclick=()=>{ S.tab='visits'; render(); window.scrollTo(0,0); });
  $$('[data-f]').forEach(b=>b.onclick=()=>{ const r=S.routes[+b.dataset.f], mx=maxFreq(r.dest,planeOf(r).cls); r.freq=clamp(r.freq+ +b.dataset.d,1,mx); save(); render(); });
  $$('[data-p]').forEach(b=>b.onclick=()=>{ S.routes[+b.dataset.p].price=b.dataset.k; save(); render(); });
  $$('[data-close]').forEach(b=>b.onclick=()=>{ S.routes.splice(+b.dataset.close,1); save(); render(); });
  $$('[data-lease]').forEach(b=>b.onclick=()=>{ const k=b.dataset.lease, P=PLANES[k]; if(S.money<P.deposit) return; S.money-=P.deposit; S.fleet.push({id:'p'+S.next, cls:k, name:'Manu '+S.next}); S.next++; save(); toast(t('A new {p} joins the fleet!',{p:t(P.name)})); confetti(); render(); });
  $$('[data-ret]').forEach(b=>b.onclick=()=>{ const i=S.fleet.findIndex(p=>p.id===b.dataset.ret); if(i<0) return; S.money+=PLANES[S.fleet[i].cls].deposit/2; S.fleet.splice(i,1); save(); render(); });
  $$('[data-rn]').forEach(b=>b.onclick=()=>{ S.rename=b.dataset.rn; render(); const i=$('#rn'); if(i){ i.focus(); i.select(); i.onkeydown=e=>{ if(e.key==='Enter') $('[data-rnok]').click(); }; } });
  $$('[data-rnok]').forEach(b=>b.onclick=()=>{ const p=S.fleet.find(x=>x.id===b.dataset.rnok), v=($('#rn').value||'').trim().slice(0,18); if(p&&v) p.name=v; S.rename=null; save(); render(); });
  $$('[data-visit]').forEach(b=>b.onclick=()=>openVisit(b.dataset.visit,b.dataset.id));
  const tb=$('#tip'); if(tb) tb.onclick=()=>{ S.tip=(S.tip||0)+1; save(); render(); };
  const f=$('#fly'); if(f) f.onclick=()=>{ f.disabled=true; S.tab='map'; S.sel=null; const R=flyWeek(); R.shown=0;
    $('#view').innerHTML=`<div class="mapbox">${mapSVG({anim:R})}</div><div class="card flying"><svg viewBox="-30 -24 58 46" width="44" class="hop">${manuSVG(1,'happy')}</svg><p>${t('The planes are flying…')}</p></div>`;
    setTimeout(()=>{ S.tab='report'; render(); window.scrollTo(0,0); toast(R.profit>=0?t('A good week: {p}',{p:fmt(R.profit)}):t('A hard week: {p}. Try other prices or plane sizes.',{p:fmt(R.profit)}),3200); },REDUCED()?600:3300); }; }

/* ===================== Manu Tere Nui 0.1.2 · fun: goals, the manu's tips, confetti, the title poster =====================
   Goals give children a next step and a small bonus (placeholder amounts, to balance with the economy in 0.2).
   The tips repeat rules of the game (03-sim.js), not outside facts. The poster scene is an illustration
   (a high island at sunset seen across a lagoon), not a precise drawing of a real place. */
const GOALS=[
  {id:'route', title:'Open your first route', ok:()=>S.routes.length>0, bonus:10000},
  {id:'pax1', title:'Fly {n} passengers', n:2000, ok:()=>S.paxTotal>=2000, prog:()=>S.paxTotal, bonus:20000},
  {id:'visit', title:'Get your first passport stamp', ok:()=>stampsDone()>0, bonus:20000},
  {id:'plane2', title:'Lease a second plane', ok:()=>S.fleet.length>1, bonus:30000},
  {id:'abroad', title:'Open a route to another country', ok:()=>Object.keys(S.opened).some(k=>AIRPORTS[k].country!=='French Polynesia'), bonus:40000},
  {id:'stars', title:'Reach a reputation of {n} stars', n:60, ok:()=>S.rep>=60, prog:()=>S.rep, bonus:40000},
  {id:'pax2', title:'Fly {n} passengers', n:20000, ok:()=>S.paxTotal>=20000, prog:()=>S.paxTotal, bonus:80000},
  {id:'stamps', title:'Collect every stamp of the passport', ok:()=>stampsDone()>=stampsAll(), prog:()=>stampsDone(), nAll:()=>stampsAll(), bonus:80000} ];
const goalText=g=>t(g.title,{n:num(g.n||0)});
function checkGoals(){ let won=null; GOALS.forEach(g=>{ if(!S.goals[g.id]&&g.ok()){ S.goals[g.id]=S.week; S.money+=g.bonus; won=g; } });
  if(won){ save(); setTimeout(()=>{ toast(`<b>${t('Goal reached!')}</b> ${goalText(won)} <span class="pos">+${fmt(won.bonus)}</span>`,3600); confetti(); },350); } }
function goalRibbon(){ const g=GOALS.find(x=>!S.goals[x.id]), done=GOALS.filter(x=>S.goals[x.id]).length;
  if(!g) return `<div class="goal done"><b>${t('Every goal reached. Bravo, captain!')}</b></div>`;
  const max=g.nAll?g.nAll():g.n, pr=g.prog&&max?clamp(g.prog()/max,0,1):0;
  return `<div class="goal"><div class="gtop"><small>${t('Next goal ({n} of {all} done)',{n:done,all:GOALS.length})}</small><span class="bonus">+${fmt(g.bonus)}</span></div><b>${goalText(g)}</b>${g.prog?`<div class="bar"><div style="width:${Math.round(pr*100)}%"></div></div>`:''}</div>`; }

/* the manu talks: a helpful line first, then tips and jokes in turn (tap the bubble for the next one) */
const TIPS=()=>[t('Planes about 70 to 97 % full make passengers happy and bring you stars.'),t('A bigger plane is not always better: empty seats still burn fuel.'),t('Visit the places you fly to. People there will want to fly with you.'),t('Saver prices fill the plane. High prices fill the till, but cost a little reputation. Try both!'),t('From November to April, cyclones can cancel some flights. Keep some savings.'),t('I can fly by myself, but the passengers prefer the plane.'),t('Seat 1A is mine. Window, please!'),t('My feathers are the livery. Very economical.'),t('In the hangar, tap “Rename” to give a plane its own name.')];
function tipBubble(){ let msg, mood='ok';
  if(!S.routes.length){ msg=t('ʻIa ora na! I am the manu, and this is our little airline. Tap Bora Bora on the map and open our first route.'); mood='wow'; }
  else if(S.last&&S.last.routes.some(x=>x.load<.4)){ msg=t('Some planes flew almost empty. Try fewer flights, a smaller plane or a Saver price.'); mood='sad'; }
  else { const T=TIPS(); msg=T[(S.tip||0)%T.length]; mood=(S.tip||0)%3===2?'happy':'ok'; }
  return `<button class="bubble" id="tip" aria-label="${t('Next tip from the manu')}"><svg viewBox="-30 -24 58 46" width="58" aria-hidden="true">${manuSVG(1,mood)}</svg><span>${msg}</span></button>`; }

/* confetti in the airline colours; skipped when the player prefers less motion */
function confetti(){ if(REDUCED()) return; const box=document.createElement('div'); box.className='confetti'; const C=['#EF4F3A','#12A5A0','#FFB627','#6C4AB6','#FF8FA3'];
  for(let i=0;i<36;i++){ const e=document.createElement('i'); e.style.cssText=`left:${Math.random()*100}%;background:${C[i%5]};animation-delay:${(Math.random()*.4).toFixed(2)}s;animation-duration:${(1.4+Math.random()).toFixed(2)}s;--dx:${Math.round(Math.random()*120-60)}px;--r:${Math.round(Math.random()*720-360)}deg`; box.appendChild(e); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),2800); }

/* the title poster, in the style of the old Pacific travel posters */

    <linearGradient id="psea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A8DB3"/><stop offset="1" stop-color="#12A5A0"/></linearGradient></defs>
    <rect width="360" height="400" fill="url(#psky)"/><circle cx="214" cy="226" r="78" fill="#FFB627"/><circle cx="214" cy="226" r="60" fill="#FFC94D"/>
    <path d="M30 120 Q120 104 230 96" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-dasharray="1 7" stroke-linecap="round" opacity=".9"/>
    <g transform="translate(228 70) rotate(-8) scale(.42)" class="pp-plane">${planeSVG('jet').replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g>
    <path d="M60 232 L84 200 L96 172 L104 190 L114 146 L126 176 L136 160 L150 196 L172 180 L196 206 L236 214 L280 232Z" fill="#6C4AB6" opacity=".85"/>
    <path d="M150 232 L168 210 L182 214 L196 206 L236 214 L280 232Z" fill="#5A3C9C" opacity=".7"/>
    <rect y="232" width="360" height="168" fill="url(#psea)"/>${rays}
